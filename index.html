<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Sports IQ Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #080d18;
      color: #f3f6ff;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 520px;
      margin: 40px auto;
      padding: 24px;
      background: #111a2b;
      border: 1px solid #253653;
      border-radius: 18px;
    }
    h1 { color: #55b8ff; }
    p { color: #b8c5dc; line-height: 1.5; }
    input, select, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }
    input, select {
      background: #080d18;
      color: white;
      border: 1px solid #344765;
    }
    button {
      background: #168cff;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #result {
      margin-top: 20px;
      padding: 16px;
      background: #080d18;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
    .warning { font-size: 13px; color: #ffc875; }
  </style>
</head>
<body>
<main>
  <h1>⚽ Sports IQ</h1>
  <p>Test your Gemini API connection by generating one sports question.</p>
  <p class="warning">
    Private local test only. Do not publish this page with your API key.
  </p>
  <input id="apiKey" type="password" placeholder="Paste your Gemini API key">
  <select id="sport">
    <option value="Football">Football</option>
    <option value="Basketball">Basketball</option>
    <option value="Tennis">Tennis</option>
    <option value="Boxing">Boxing</option>
    <option value="Athletics">Athletics</option>
  </select>
  <select id="difficulty">
    <option value="Easy">Easy — 5 points</option>
    <option value="Medium">Medium — 10 points</option>
    <option value="Hard">Hard — 15 points</option>
  </select>
  <button id="generate">Generate Question</button>
  <div id="result">Your generated question will appear here.</div>
</main>
<script>
const GEMINI_API_KEY = "AIzaSyCsI03VGwXQiVUNRYeMiV1Mswxa_8ovruU";
const button = document.getElementById("generate");
const result = document.getElementById("result");
button.addEventListener("click", async () => {
  const apiKey = GEMINI_API_KEY;
  const sport = document.getElementById("sport").value;
  const difficulty = document.getElementById("difficulty").value;
  button.disabled = true;
  result.textContent = "Connecting to Gemini and generating a question...";
  const prompt = `
Generate exactly one ${difficulty.toLowerCase()}-level ${sport} trivia question.
Return only valid JSON in this format:
{
  "question": "Question text",
  "options": {
    "A": "First option",
    "B": "Second option",
    "C": "Third option",
    "D": "Fourth option"
  },
  "correct_answer": "A",
  "explanation": "Brief explanation",
  "difficulty": "${difficulty}",
  "points": ${difficulty === "Easy" ? 5 : difficulty === "Medium" ? 10 : 15}
}
Requirements:
- Exactly four distinct answer options.
- Exactly one correct answer.
- Ensure the answer is factually accurate.
- Do not include markdown fences.
`;
  try {
    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey
        },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: prompt }]
          }],
          generationConfig: {
            temperature: 0.4,
            responseMimeType: "application/json"
          }
        })
      }
    );
    const data = await response.json();
    if (!response.ok) {
      throw new Error(
        data.error?.message || `Request failed with HTTP ${response.status}`
      );
    }
    const text = data.candidates?.[0]?.content?.parts
      ?.map(part => part.text || "")
      .join("")
      .trim();
    if (!text) {
      throw new Error("Gemini returned no question text.");
    }
    const question = JSON.parse(text);
    if (
      !question.question ||
      !question.options ||
      !["A", "B", "C", "D"].every(key => question.options[key]) ||
      !["A", "B", "C", "D"].includes(question.correct_answer)
    ) {
      throw new Error("Gemini returned an invalid question format.");
    }
    result.textContent =
      `✅ GEMINI API WORKING!\n\n` +
      `Sport: ${sport}\n` +
      `Difficulty: ${question.difficulty}\n` +
      `Points: ${question.points}\n\n` +
      `${question.question}\n\n` +
      `A. ${question.options.A}\n` +
      `B. ${question.options.B}\n` +
      `C. ${question.options.C}\n` +
      `D. ${question.options.D}\n\n` +
      `Correct answer: ${question.correct_answer}\n` +
      `${question.explanation || ""}`;
  } catch (error) {
    result.textContent = `❌ TEST FAILED\n\n${error.message}`;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
